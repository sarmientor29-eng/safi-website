<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAFI | Field submission review demo</title><style>:root{font:15px/1.5 system-ui;background:#f1f5f9;color:#152a3d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:950px;margin:auto;padding:24px 16px}h1{margin-bottom:5px}p{color:#52667a}.warning{background:#fff3d5;border:1px solid #e5c56e;border-radius:12px;padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.card{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:18px}.card strong{font-size:26px}.entry{margin:14px 0}.tag{font-size:12px;color:#0e7490;font-weight:700}button{background:#145b80;color:white;border:0;border-radius:9px;padding:11px 14px;min-height:44px;cursor:pointer;margin:5px 5px 0 0}button.secondary{background:#52667a}input{width:100%;padding:12px;border:1px solid #8ba0b3;border-radius:8px;font:inherit}button:disabled{opacity:.5}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="staging-dashboard.html">← Admin staging dashboard</a><h1>Field submissions</h1><p>Review workflow preview</p><div class="warning"><strong>Demo only.</strong> These are fictional submissions stored in page memory. They are NOT linked to worker devices, IndexedDB, Firebase or any backend. Clicking “Simulate receipt” is not proof of upload.</div><section class="grid" id="summary"></section><section id="entries"></section></main><script type="module">import {createSubmission,markReceived,reviewSubmission,summarizeQueue} from "./field-sync-core.mjs";let items=[createSubmission({id:"demo-progress",kind:"progress",project:"Demo - Commercial Interior",notes:"Drywall installed on level 2",photoCount:2},Date.now()),createSubmission({id:"demo-expense",kind:"expense",project:"Demo - Residential Renovation",notes:"Parking",amountCents:1250,photoCount:1},Date.now())];const el=id=>document.getElementById(id);function render(){const totals=summarizeQueue(items);el("summary").replaceChildren(...["pending","received","approved","rejected"].map(key=>{const c=document.createElement("div");c.className="card";const h=document.createElement("div");h.textContent=key.toUpperCase();const n=document.createElement("strong");n.textContent=totals[key];c.append(h,n);return c}));el("entries").replaceChildren(...items.map(item=>{const card=document.createElement("article");card.className="card entry";const title=document.createElement("h2");title.textContent=item.kind==="expense"?"Expense":"Progress";const details=document.createElement("p");details.textContent=item.project+" · "+item.notes+(item.amountCents!=null?" · $"+(item.amountCents/100).toFixed(2)+" CAD":"");const state=document.createElement("p");state.className="tag";state.textContent="Status: "+item.status;card.append(title,details,state);if(item.reviewNote){const note=document.createElement("p");note.textContent="Review note: "+item.reviewNote;card.append(note)}if(item.status==="pending"){const b=document.createElement("button");b.textContent="Simulate receipt (demo)";b.onclick=()=>{items=items.map(x=>x.id===item.id?markReceived(x,"DEMO-"+x.id):x);render()};card.append(b)}if(item.status==="received"){const input=document.createElement("input");input.placeholder="Reason required for rejection";input.setAttribute("aria-label","Review note");card.append(input);for(const decision of ["approved","rejected"]){const b=document.createElement("button");b.textContent=decision==="approved"?"Approve":"Reject";if(decision==="rejected")b.className="secondary";b.onclick=()=>{try{items=items.map(x=>x.id===item.id?reviewSubmission(x,decision,input.value):x);render()}catch(e){alert(e.message)}};card.append(b)}}return card}))}render();</script></body></html>
