<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAFI | Local correction review</title><style>body{font:16px system-ui;background:#f1f5f9;color:#183047;margin:0;padding:20px}main{max-width:720px;margin:auto}.card{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:18px;margin:16px 0}button,input{font:inherit;padding:12px;border-radius:8px;min-height:44px}button{background:#145b80;color:white;border:0;margin:5px}input{width:100%;box-sizing:border-box;border:1px solid #94a3b8}.warn{background:#fff1c7;padding:14px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Correction review — localhost demo</h1><p class="warn">Fictional data only. No login, authorization, permanent storage or real worker notifications. Do not expose this demo server to a network.</p><button id="refresh">Refresh received replies</button><div id="items"></div><p id="status" role="status"></p></main><script>const $=id=>document.getElementById(id);async function refresh(){const host=$("items");host.replaceChildren();try{const res=await fetch("/api/demo-correction-replies");if(!res.ok)throw Error("Server error");const data=await res.json();if(!data.replies.length){host.textContent="No worker responses received by this demo server.";return}for(const reply of data.replies){const card=document.createElement("section");card.className="card";const title=document.createElement("h2");title.textContent=reply.requestId;const p=document.createElement("p");p.textContent="Worker response: "+reply.notes;const photo=document.createElement("p");photo.textContent=reply.photoCount+" validated photo(s); originals are not stored.";card.append(title,p,photo);if(reply.review){const result=document.createElement("p");result.textContent="Reviewed: "+reply.review.decision+" · "+reply.review.note;card.append(result)}else{const input=document.createElement("input");input.placeholder="Reason required when requesting more information";card.append(input);for(const decision of ["accepted","needs-more-information"]){const button=document.createElement("button");button.textContent=decision==="accepted"?"Accept response":"Request more information";button.onclick=async()=>{button.disabled=true;try{const response=await fetch("/api/demo-correction-review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId:reply.requestId,decision,note:input.value})});const result=await response.json();if(!response.ok)throw Error(result.error);$("status").textContent="Review recorded in server memory (demo).";await refresh()}catch(e){$("status").textContent=e.message}finally{button.disabled=false}};card.append(button)}}host.append(card)}}catch(e){host.textContent="Local demo server unavailable: "+e.message}}$("refresh").onclick=refresh;refresh();</script></body></html>
